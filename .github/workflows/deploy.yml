# Laedt die Seite bei jedem Push auf main per SFTP auf den Strato-Webspace.
#
# Einmalig einzurichten unter Settings -> Secrets and variables -> Actions:
#   SFTP_HOST      der SFTP-Server aus dem Strato-Kundenlogin
#   SFTP_USER      der zugehoerige Benutzername
#   SFTP_PASSWORD  das Passwort des SFTP-Zugangs
# Optional als Variable (nicht Secret):
#   REMOTE_DIR     Zielverzeichnis auf dem Webspace, Standard "/"
#
# Fehlen die Secrets, schlaegt der Workflow fehl. Frueher wurde er still
# uebersprungen und meldete trotzdem Erfolg - dabei war sieben Deploys lang
# nichts auf dem Webspace gelandet, ohne dass es jemandem auffiel.

name: Auf Strato veroeffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: strato-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zugangsdaten pruefen
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          missing=""
          for name in SFTP_HOST SFTP_USER SFTP_PASSWORD; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            {
              echo "## Veroeffentlichung nicht moeglich"
              echo
              echo "Es fehlen die Secrets:$missing"
              echo
              echo "Anzulegen unter **Settings -> Secrets and variables -> Actions**:"
              echo
              echo "| Secret | Inhalt |"
              echo "| --- | --- |"
              echo "| \`SFTP_HOST\` | SFTP-Server aus dem Strato-Kundenlogin |"
              echo "| \`SFTP_USER\` | zugehoeriger Benutzername |"
              echo "| \`SFTP_PASSWORD\` | Passwort des SFTP-Zugangs |"
              echo
              echo "Optional als Variable: \`REMOTE_DIR\` (Zielverzeichnis, Standard \`/\`)."
              echo
              echo "Solange sie fehlen, wird nichts auf den Webspace geladen -"
              echo "die Seite auf kfzservice-buila.de bleibt auf dem alten Stand."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Deploy nicht konfiguriert::Es fehlen die Secrets:$missing - siehe Job-Zusammenfassung."
            exit 1
          fi

      - name: Werkzeuge installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp sshpass

      - name: Dateien hochladen
        env:
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          REMOTE_DIR: ${{ vars.REMOTE_DIR || '/' }}
        run: |
          set -euo pipefail

          # Bewusst ohne --delete: api/config.php liegt nur auf dem Server und
          # enthaelt die Zugangsdaten zum Postfach. Ein Spiegeln mit Loeschen
          # wuerde sie bei jedem Deploy entfernen.
          lftp -c "
            set sftp:auto-confirm yes;
            set sftp:connect-program 'sshpass -e ssh -a -x -o StrictHostKeyChecking=accept-new';
            set net:max-retries 3;
            set net:timeout 20;
            open -u \"$SFTP_USER\",dummy sftp://$SFTP_HOST;
            mkdir -f -p \"$REMOTE_DIR\";
            mirror -R --verbose --parallel=4 \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob node_modules/ \
              --exclude-glob api/config.php \
              ./ \"$REMOTE_DIR\";
          "

      - name: Ergebnis
        run: echo "Veroeffentlichung abgeschlossen." >> "$GITHUB_STEP_SUMMARY"
